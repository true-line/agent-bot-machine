name: Public Homebrew upgrade
on:
  pull_request:
    paths:
      - Formula/managed-machine.rb
      - tests/public-brew-upgrade-macos.sh
      - tests/public-brew-keg.test.sh
      - tests/fixtures/verify-public-brew-keg.sh
      - tests/fixtures/public-brew-services-macos.py
      - .github/workflows/public-brew-upgrade.yml
  push:
    branches: [main]
    paths:
      - Formula/managed-machine.rb
      - tests/public-brew-upgrade-macos.sh
      - tests/public-brew-keg.test.sh
      - tests/fixtures/verify-public-brew-keg.sh
      - tests/fixtures/public-brew-services-macos.py
      - .github/workflows/public-brew-upgrade.yml
permissions:
  contents: read
jobs:
  upgrade:
    name: Published releases on macOS 27
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check wrong versions, links, bytes and modes are refused
        run: /bin/bash tests/public-brew-keg.test.sh
      - name: Upgrade the previous public formula and clean its old keg
        run: /bin/bash tests/public-brew-upgrade-macos.sh
