name: macOS 27 HQ installation
on:
  pull_request:
    paths:
      - '.github/workflows/darwin-hq-install.yml'
      - 'cmd/managed-machine/**'
      - 'internal/daemon/**'
      - 'internal/members/**'
      - 'tests/members-apply-macos.test.sh'
      - 'tests/fixtures/*darwin-hq*'
      - 'tests/fixtures/hq-launchd-install.sh'
      - 'tests/fixtures/hq-launchd-runtime.c'
  push:
    branches: [main]
    paths:
      - '.github/workflows/darwin-hq-install.yml'
      - 'cmd/managed-machine/**'
      - 'internal/daemon/**'
      - 'internal/members/**'
      - 'tests/members-apply-macos.test.sh'
      - 'tests/fixtures/*darwin-hq*'
      - 'tests/fixtures/hq-launchd-install.sh'
      - 'tests/fixtures/hq-launchd-runtime.c'
  workflow_call:
    inputs:
      formula_qualification:
        type: string
        required: true
      device_release_version:
        type: string
        required: true
      device_archive_sha256:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      require_sip:
        description: Require fully enabled SIP and exercise the v2 production endpoint
        type: boolean
        default: true
      device_release_version:
        description: Optional signed Machine release version for native dedicated HQ device custody qualification
        type: string
      device_archive_sha256:
        description: Reviewed SHA-256 of the matching signed Darwin arm64 archive
        type: string
      device_homebrew_install:
        description: Test the public Homebrew installation of the specified signed release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  install:
    if: inputs.formula_qualification != 'package'
    name: Machine installs the pinned HQ release on macOS 27
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Fetch the reviewed signed Machine release for optional hardware qualification
        if: inputs.device_release_version != '' || inputs.device_archive_sha256 != '' || inputs.device_homebrew_install
        shell: bash
        env:
          MM_DEVICE_VERSION: ${{ inputs.device_release_version }}
          MM_DEVICE_SHA: ${{ inputs.device_archive_sha256 }}
        run: |
          [[ "$MM_DEVICE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$MM_DEVICE_SHA" =~ ^[0-9a-f]{64}$ ]]
          archive="managed-machine_${MM_DEVICE_VERSION}_darwin_arm64.tar.gz"
          source tests/fixtures/install-homebrew-darwin-hq-device.sh
          fetch_public_device_archive "$MM_DEVICE_VERSION" "$RUNNER_TEMP" "$MM_DEVICE_SHA" >/dev/null
          echo "MM_HQ_DEVICE_VERSION=$MM_DEVICE_VERSION" >> "$GITHUB_ENV"
          echo "MM_HQ_DEVICE_ARCHIVE=$RUNNER_TEMP/$archive" >> "$GITHUB_ENV"
          echo "MM_HQ_DEVICE_SHA256=$MM_DEVICE_SHA" >> "$GITHUB_ENV"
      - name: Install the real HQ archive with a signed first-HQ approval
        shell: bash
        env:
          MM_HQ_DEVICE_HOMEBREW: ${{ inputs.device_homebrew_install || inputs.formula_qualification == 'custody' || 'false' }}
          MM_HQ_TAP_REVISION: ${{ inputs.formula_qualification && github.sha || '' }}
          MM_HQ_REQUIRE_SIP: ${{ inputs.require_sip || 'false' }}
          MM_MEMBERS_REAL_ACCOUNTS: '1'
          MM_MEMBERS_RUNNER: ${{ runner.environment }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          if [[ -n "${MM_HQ_DEVICE_ARCHIVE:-}" ]]; then
            MM_KEYD_CUSTODY_TEST=1 bash tests/fixtures/with-keyd-test-keychain.sh bash tests/members-apply-macos.test.sh --real-hq
          else
            bash tests/members-apply-macos.test.sh --real-hq
          fi
  rollback-macos-15:
    if: inputs.formula_qualification != 'custody'
    name: HQ socket rollback on macOS 15
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Check socket preservation when guarded removal is unavailable
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          sw_vers
          [[ "$(sw_vers -productVersion)" == 15.* ]]
          go test -v -count=1 -race ./internal/members -run '^TestRollbackOfObservedLaunchSocket$'
      - name: Verify the current public Homebrew Machine and keyd
        if: github.event_name == 'pull_request' || inputs.formula_qualification == 'package'
        env:
          MM_HQ_TAP_REVISION: ${{ inputs.formula_qualification && github.sha || '' }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          MM_HQ_DEVICE_VERSION: ${{ inputs.device_release_version }}
          MM_HQ_DEVICE_SHA256: ${{ inputs.device_archive_sha256 }}
          HOMEBREW_NO_ANALYTICS: '1'
        run: bash tests/fixtures/public-homebrew-darwin-hq-device.sh
