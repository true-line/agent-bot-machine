name: macOS 27 HQ installation
on:
  pull_request:
    paths:
      - '.github/workflows/darwin-hq-install.yml'
      - 'cmd/managed-machine/**'
      - 'internal/daemon/**'
      - 'internal/members/**'
      - 'tests/members-apply-macos.test.sh'
      - 'tests/fixtures/*darwin-hq*'
      - 'tests/fixtures/hq-launchd-install.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/darwin-hq-install.yml'
      - 'cmd/managed-machine/**'
      - 'internal/daemon/**'
      - 'internal/members/**'
      - 'tests/members-apply-macos.test.sh'
      - 'tests/fixtures/*darwin-hq*'
      - 'tests/fixtures/hq-launchd-install.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: Machine installs the pinned HQ release on macOS 27
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the real HQ archive with a signed first-HQ approval
        shell: bash
        env:
          MM_MEMBERS_REAL_ACCOUNTS: '1'
          MM_MEMBERS_RUNNER: ${{ runner.environment }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          bash tests/members-apply-macos.test.sh --real-hq
