# Sign workflow (docs/plans/macos-signing.md). On a reviewed version request
# merged to main, sign the Machine CLI and the owner approval app at the same
# version. Each matrix job stages a separate draft for tag-driven publication.
# A manually approved recovery dispatch signs only the selected artifact.
name: Sign

on:
  push:
    branches: [main]
    paths: [.github/machine-release-version]
  workflow_dispatch:
    inputs:
      artifact:
        description: 'Artifact to sign and stage as a draft'
        type: choice
        default: machine
        options:
          - machine
          - owner-presence
      version:
        description: 'Release version without the v (for example, 0.11.4)'
        required: true
        type: string

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  request:
    name: Resolve the release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifacts: ${{ steps.version.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the reviewed Machine request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_PROTECTED" == true ]] || { echo "Signing requires a protected main branch" >&2; exit 1; }
          pr="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" |
            jq -er --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
              [.[][] | select(.merged_at != null and .base.ref == "main" and
                .base.repo.full_name == $repo and .merge_commit_sha == $sha)] | select(length == 1) | .[0]')"
          number="$(jq -er .number <<<"$pr")"
          head="$(jq -er .head.sha <<<"$pr")"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$number/files?per_page=100" |
            jq -e 'any(.[][]; .filename == ".github/machine-release-version" and (.status == "added" or .status == "modified"))' >/dev/null
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$number/reviews?per_page=100" |
            jq -e --arg head "$head" '
              [.[][] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] |
              group_by(.user.id) | map(max_by(.id)) |
              all(.[]; .state != "CHANGES_REQUESTED") and any(.[]; .state == "APPROVED" and .commit_id == $head)' >/dev/null
      - name: Verify the manual approval environment
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release-manual" |
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .reviewer.id > 0))' >/dev/null || {
              echo "Configure at least one required reviewer on the release-manual environment before manual signing" >&2
              exit 1
            }
      - id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          ARTIFACT_INPUT: ${{ inputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="$(cat .github/machine-release-version)"
            artifacts='["machine","owner-presence"]'
          else
            version="$VERSION_INPUT"
            case "${ARTIFACT_INPUT:-machine}" in
              machine) artifacts='["machine"]' ;;
              owner-presence) artifacts='["owner-presence"]' ;;
              *) exit 1 ;;
            esac
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release version of the form X.Y.Z' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifacts=$artifacts" >> "$GITHUB_OUTPUT"

  manual-approval:
    name: Approve manual signing
    needs: request
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-manual
    permissions:
      actions: read
    steps:
      - name: Confirm this run received manual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e 'any(.[]; .state == "approved" and any(.environments[]?; .name == "release-manual"))' >/dev/null

  sign:
    needs: [request, manual-approval]
    strategy:
      fail-fast: false
      matrix:
        artifact: ${{ fromJSON(needs.request.outputs.artifacts) }}
    concurrency:
      group: sign-${{ matrix.artifact }}-${{ needs.request.outputs.version }}
      cancel-in-progress: false
    name: sign ${{ matrix.artifact }} (darwin/arm64)
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.request.result == 'success' &&
      ((github.event_name == 'push' && needs.manual-approval.result == 'skipped') ||
      (github.event_name == 'workflow_dispatch' && needs.manual-approval.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"
      VERSION: ${{ needs.request.outputs.version }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the requested version
        env:
          ARTIFACT: ${{ matrix.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if [[ "$ARTIFACT" == owner-presence ]]; then tag="owner-presence-v$VERSION"; fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Error: tag $tag already exists" >&2
            exit 1
          fi
      - name: Check out the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        if: matrix.artifact == 'machine'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the pinned Rust toolchain
        if: matrix.artifact == 'machine'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build the deterministic archives
        if: matrix.artifact == 'machine'
        run: go run ./cmd/mm-release build -version "$VERSION" -out "$RUNNER_TEMP/unsigned"
      - name: Check out the reviewed owner app
        if: matrix.artifact == 'owner-presence'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: true-line/agent-bot-identity
          ref: 954e1d653b506f847527c8652a2ec4ac4ae09292 # Identity #1456
          path: owner-source
          persist-credentials: false
          sparse-checkout: owner-presence-macos
      - name: Build the reviewed owner app
        if: matrix.artifact == 'owner-presence'
        run: owner-source/owner-presence-macos/build.sh "$RUNNER_TEMP/owner"
      - name: Decode the embeddable distribution profile
        if: matrix.artifact == 'owner-presence'
        env:
          PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
        run: |
          : "${PROFILE:?The release environment needs the owner app Developer ID distribution profile}"
          printf '%s' "$PROFILE" | base64 -D >"$RUNNER_TEMP/owner/owner.provisionprofile"
          security cms -D -i "$RUNNER_TEMP/owner/owner.provisionprofile" >"$RUNNER_TEMP/owner/profile.plist"
      - name: Import the signing identity into a temporary keychain
        env:
          P12: ${{ secrets.MACOS_DEVID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVID_P12_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/sign.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$P12" | base64 -D >"$RUNNER_TEMP/identity.p12"
          printf '%s' "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          esc_p12="${P12_PASSWORD//\\/\\\\}"
          esc_p12="${esc_p12//\"/\\\"}"
          # Pipe password-bearing subcommands to `security -i` on stdin so
          # neither the keychain password nor the .p12 password appears in argv.
          security -i >/dev/null <<EOF
          create-keychain -p "$keychain_password" "$keychain"
          EOF
          security set-keychain-settings -lut 3600 "$keychain"
          security -i >/dev/null <<EOF
          unlock-keychain -p "$keychain_password" "$keychain"
          EOF
          security -i >/dev/null <<EOF
          import "$RUNNER_TEMP/identity.p12" -k "$keychain" -P "$esc_p12" -f pkcs12 -T /usr/bin/codesign
          EOF
          security -i >/dev/null <<EOF
          set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          EOF
          rm -f "$RUNNER_TEMP/identity.p12"
          # SecCodeSignerCreate searches the user keychain search list for the
          # identity's private key even when --keychain is passed to codesign.
          # Save the original list so the always() step restores it.
          security list-keychains -d user | tr -d '"' | awk '{$1=$1; if ($0 != "") print}' >"$RUNNER_TEMP/orig-keychains"
          orig_kcs=()
          while IFS= read -r kc; do
            [[ -n "$kc" ]] && orig_kcs+=("$kc")
          done <"$RUNNER_TEMP/orig-keychains"
          security list-keychains -d user -s "$keychain" "${orig_kcs[@]}"
          echo "SIGN_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >>"$GITHUB_ENV"
      - name: Sign, notarize and verify
        env:
          ARTIFACT: ${{ matrix.artifact }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [[ "$ARTIFACT" == owner-presence ]]; then
            scripts/sign-owner-app "$VERSION"
          else
            scripts/sign-darwin "$VERSION" "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/signed"
          fi
      - name: Stage the signed files in the matching draft
        env:
          ARTIFACT: ${{ matrix.artifact }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$ARTIFACT" == owner-presence ]]; then
            tag="owner-presence-v$VERSION"
            title="Owner Approval $VERSION"
            zip="$RUNNER_TEMP/AgentBotOwnerPresence_${VERSION}_darwin_arm64.zip"
            files=("$zip" "$zip.sha256")
          else
            tag="v$VERSION"
            title="$tag"
            files=("$RUNNER_TEMP"/signed/*)
          fi
          if draft="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null)"; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' <<<"$draft" >/dev/null || {
              echo "Refusing to update $tag: expected a draft targeting $GITHUB_SHA" >&2
              exit 1
            }
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" --title "$title" --notes "Signed by Machine at $GITHUB_SHA."
          fi
      - name: Remove the signing material
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/orig-keychains" ]]; then
            orig_kcs=()
            while IFS= read -r kc; do
              [[ -n "$kc" ]] && orig_kcs+=("$kc")
            done <"$RUNNER_TEMP/orig-keychains"
            if [[ ${#orig_kcs[@]} -gt 0 ]]; then
              security list-keychains -d user -s "${orig_kcs[@]}" 2>/dev/null || true
            fi
          fi
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/identity.p12" "$RUNNER_TEMP/orig-keychains"
