name: Prepare Machine release
on:
  push:
    branches: [main]
    paths-ignore:
      - Formula/managed-machine.rb
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Metadata to reconcile on main
        options: [version, homebrew]
        default: version

permissions:
  contents: read

concurrency:
  group: prepare-machine-${{ (github.event_name == 'workflow_run' || inputs.operation == 'homebrew') && 'homebrew' || 'version' }}
  cancel-in-progress: false

jobs:
  open-pr:
    if: >-
      github.ref == 'refs/heads/main' && github.ref_protected &&
      github.repository == 'true-line/agent-bot-machine' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.path == '.github/workflows/release.yml' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    environment: version-cut
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release metadata on the current protected main
        id: prepare
        env:
          API_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/prepare-release.mjs prepare
      - name: Mint the release PR App token
        if: steps.prepare.outputs.version != ''
        id: chores
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open or refresh the version or Homebrew PR
        if: steps.prepare.outputs.version != ''
        env:
          API_TOKEN: ${{ steps.chores.outputs.token }}
          APP_SLUG: ${{ steps.chores.outputs.app-slug }}
          VERSION: ${{ steps.prepare.outputs.version }}
          EVENT: ${{ github.event_name }}
          OPERATION: ${{ inputs.operation }}
        run: node scripts/prepare-release.mjs open-pr
