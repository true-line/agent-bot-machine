# Verify the tagged five-target build, render its signed Homebrew pin and publish the draft.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify or publish (for example, v0.9.0)'
        required: true
        type: string
      publish:
        description: 'Publish the GitHub release (false runs the gates only as a dry run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  gates:
    name: gates
    uses: ./.github/workflows/go-core.yml

  public-homebrew:
    name: Install and qualify the published macOS release
    needs: publish
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the released package and service lifecycle
        env:
          MM_HQ_TAP_REVISION: ${{ needs.publish.outputs.source_commit }}
          MM_HQ_DEVICE_VERSION: ${{ needs.publish.outputs.version }}
          MM_HQ_DEVICE_SHA256: ${{ needs.publish.outputs.archive_digest }}
          MM_HQ_FORMULA_SHA256: ${{ needs.publish.outputs.formula_digest }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: bash tests/fixtures/public-homebrew-darwin-hq-device.sh --published-formula

  publish:
    name: publish
    outputs:
      source_commit: ${{ steps.render.outputs.source_commit }}
      version: ${{ steps.render.outputs.version }}
      archive_digest: ${{ steps.render.outputs.archive_digest }}
      formula_digest: ${{ steps.render.outputs.formula_digest }}
    needs: gates
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the dist artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Download the five release-gate records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-gate-*
          path: evidence-attempts
          merge-multiple: false
      - name: Select the latest release receipt for each native target
        run: |
          python3 scripts/select-gate-evidence.py evidence-attempts release-evidence
          if compgen -G 'release-gate-*.json' >/dev/null; then
            echo 'Unexpected release receipts already exist in the publish directory' >&2
            exit 1
          fi
          for target in darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            mv "release-evidence/release-gate-$target.json" .
          done
          rmdir release-evidence
      - name: Download the support matrix
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: support-matrix
          path: .
      - name: Verify the tag and formula pin
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="v$(cat VERSION)"
          if [ -n "${INPUT_TAG:-}" ] && [ "$INPUT_TAG" != "$TAG" ]; then
            echo "Error: dispatch tag '$INPUT_TAG' does not match '$TAG'" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "${GITHUB_REF_NAME:-}" != "$TAG" ]; then
            echo "Error: pushed tag '${GITHUB_REF_NAME:-}' does not match '$TAG'" >&2
            exit 1
          fi
          git tag --points-at HEAD | grep -qxF "$TAG"
          go run ./cmd/mm-release verify -dist dist
      - name: Identify the signed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          release_id="$(bash scripts/verify-release-draft "$TAG")"
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
      - name: Download the signed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          gh release download "$TAG" --dir signed --pattern 'managed-machine_*' --pattern SHA256SUMS
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" |
            python3 scripts/verify-public-draft.py downloaded "${TAG#v}" "$RUNNER_TEMP/public-assets.json"
      - name: Render the Homebrew pin from the verified signed archive
        id: render
        run: |
          git worktree add --quiet --detach "$RUNNER_TEMP/formula" HEAD
          (cd "$RUNNER_TEMP/formula" &&
            "$GITHUB_WORKSPACE/scripts/release" render "v$(cat VERSION)" "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE/signed")
          cp "$RUNNER_TEMP/formula/Formula/managed-machine.rb" Formula/managed-machine.rb
          version="$(cat VERSION)"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive_digest=$(shasum -a 256 "signed/managed-machine_${version}_darwin_arm64.tar.gz" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "formula_digest=$(shasum -a 256 Formula/managed-machine.rb | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Verify the signed dist against the deterministic build and the formula pin
        run: go run ./cmd/mm-release verify-signed -unsigned dist -signed signed -team Z5DM34QS5U -require-keyd -formula Formula/managed-machine.rb -require-pin
          -darwin-gate release-gate-darwin-arm64.json -source-revision "$GITHUB_SHA" >> support-matrix.md
      - name: Verify both public publishers in the downloaded Darwin archive
        run: bash scripts/verify-public-darwin-publisher --archive "signed/managed-machine_$(cat VERSION)_darwin_arm64.tar.gz"
      - name: Publish the signed draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          check_draft() {
            bash scripts/verify-release-draft "$TAG" "$RELEASE_ID" >/dev/null
          }
          check_draft
          gh release upload "$TAG" support-matrix.md release-gate-*.json Formula/managed-machine.rb --clobber
          check_draft
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" |
            python3 scripts/verify-public-draft.py publish "${TAG#v}" "$RUNNER_TEMP/public-assets.json" > "$RUNNER_TEMP/public-release-notes.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f name="$TAG" -F "body=@$RUNNER_TEMP/public-release-notes.md" --silent
