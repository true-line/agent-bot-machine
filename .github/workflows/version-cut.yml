# Tag only a reviewed Machine release cut on the commit its main-push gates tested.
name: Version cut

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Go core]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: machine-version-tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  setup-check:
    name: Check release setup
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'true-line/agent-bot-machine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: version-cut
    permissions:
      actions: read
      deployments: read
      contents: read
    steps:
      - name: Mint the repository token with the release PR and tag grants
        id: chores
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check the App identity and installation repository
        env:
          GH_TOKEN: ${{ steps.chores.outputs.token }}
          APP_SLUG: ${{ steps.chores.outputs.app-slug }}
        run: |
          set -euo pipefail
          test "$APP_SLUG" = trueline-chores-dumb
          gh api installation/repositories |
            jq -e --arg repo "$GITHUB_REPOSITORY" '.total_count == 1 and .repositories[0].full_name == $repo' >/dev/null
          echo "Verified \`$APP_SLUG\` issued a token for \`$GITHUB_REPOSITORY\` with contents and pull-request write grants." >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect main branch restrictions and reviewer gates
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          failed=0
          { echo '| Environment | Main branch only | Required reviewer |'
            echo '| --- | --- | --- |'; } >> "$GITHUB_STEP_SUMMARY"
          for name in version-cut release release-manual; do
            api="repos/$GITHUB_REPOSITORY/environments/$name"
            main=unavailable; reviewer=unavailable
            if info="$(gh api "$api")"; then
              if jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and any(.reviewers[]?; .reviewer.id > 0))' <<< "$info" >/dev/null; then reviewer=yes; else reviewer=no; fi
              if jq -e '.deployment_branch_policy == {"protected_branches":false,"custom_branch_policies":true}' <<< "$info" >/dev/null; then
                if rules="$(gh api "$api/deployment-branch-policies?per_page=100")"; then
                  if jq -e '.total_count == 1 and .branch_policies[0].type == "branch" and .branch_policies[0].name == "main"' <<< "$rules" >/dev/null; then main=yes; else main=no; fi
                fi
              else
                main=no
              fi
            fi
            echo "| $name | $main | $reviewer |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$main" != yes || ( "$name" == release-manual && "$reviewer" != yes ) ]]; then failed=1; fi
            if [[ "$name" == release && "$reviewer" == yes ]]; then
              echo "::warning::The release environment still requires a reviewer. Reviewed signing requests will pause for another approval."
            fi
          done
          exit "$failed"

  identify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
      ci: ${{ steps.cut.outputs.ci }}
      core: ${{ steps.cut.outputs.core }}
      pr: ${{ steps.cut.outputs.pr }}
      head: ${{ steps.cut.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - id: cut
        name: Identify the reviewed cut and its successful main gates
        env:
          CUT: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "$CUT^1" "$CUT" -- VERSION; then exit 0; fi
          tag="$(python3 scripts/version-cut.py candidate "$CUT")"
          [[ -n "$tag" ]] || exit 0
          existing="$(python3 scripts/version-cut.py existing "$CUT" "$tag")"
          if [[ "$existing" == same ]]; then
            echo "$tag already points to the tested cut."
            exit 0
          fi
          api="repos/$GITHUB_REPOSITORY/actions/workflows"
          for workflow in ci.yml go-core.yml; do
            run="$(gh api "$api/$workflow/runs?event=push&branch=main&head_sha=$CUT&per_page=100" |
              python3 scripts/version-cut.py ci "$GITHUB_REPOSITORY" "$CUT" "$workflow")"
            if [[ -z "$run" ]]; then echo "Waiting for $workflow on $CUT"; exit 0; fi
            if [[ "$workflow" == go-core.yml ]]; then core="$run"; else ci="$run"; fi
          done
          pr_info="$(gh api "repos/$GITHUB_REPOSITORY/commits/$CUT/pulls?per_page=100" |
            python3 scripts/version-cut.py pr "$GITHUB_REPOSITORY" "$CUT" "$tag")"
          read -r pr head <<<"$pr_info"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "ci=$ci" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: identify
    if: needs.identify.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      # Viewing a private draft of a public repository requires push access.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Download the deterministic dist built by this cut's Go core run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          github-token: ${{ github.token }}
          run-id: ${{ needs.identify.outputs.core }}
          path: ${{ runner.temp }}/cut-dist
      - name: Resolve the immutable signing parent of the reviewed release PR
        id: source
        env:
          CUT: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.identify.outputs.tag }}
          PR: ${{ needs.identify.outputs.pr }}
          PR_HEAD: ${{ needs.identify.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"
          base="$(git rev-parse "$PR_HEAD^1")"
          python3 scripts/version-cut.py lineage "$CUT" "$TAG" "$base" "$PR_HEAD"
          git worktree add --quiet --detach "$RUNNER_TEMP/cut-base" "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Download the protected draft and verify each asset digest
        env:
          SIGN_BASE: ${{ steps.source.outputs.base }}
          API_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/cut-base
        run: node "$GITHUB_WORKSPACE/scripts/prepare-release.mjs" download "$SIGN_BASE" "$RUNNER_TEMP/cut-signed"
      - name: Verify the signed dist and reproduce the reviewed two-file release patch
        env:
          CUT: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.identify.outputs.tag }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          go run ./cmd/mm-release verify-signed -unsigned "$RUNNER_TEMP/cut-dist" -signed "$RUNNER_TEMP/cut-signed" \
            -team Z5DM34QS5U -require-keyd -formula Formula/managed-machine.rb -require-pin
          (cd "$RUNNER_TEMP/cut-base" &&
            "$GITHUB_WORKSPACE/scripts/release" render "$TAG" "$RUNNER_TEMP/cut-dist" "$RUNNER_TEMP/cut-signed")
          git -C "$RUNNER_TEMP/cut-base" add -- VERSION Formula/managed-machine.rb
          test "$(git -C "$RUNNER_TEMP/cut-base" write-tree)" = "$(git rev-parse "$CUT^{tree}")"

  tag:
    needs: [identify, verify]
    environment: version-cut
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the gate results still belong to this cut
        env:
          CUT: ${{ github.event.workflow_run.head_sha }}
          CI: ${{ needs.identify.outputs.ci }}
          CORE: ${{ needs.identify.outputs.core }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in "ci.yml:$CI" "go-core.yml:$CORE"; do
            workflow="${pair%:*}"
            current="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?event=push&branch=main&head_sha=$CUT&per_page=100" |
              python3 scripts/version-cut.py ci "$GITHUB_REPOSITORY" "$CUT" "$workflow")"
            test "$current" = "${pair#*:}"
          done
      # An App push triggers release.yml; GITHUB_TOKEN pushes suppress tag events.
      - name: Mint the release App token for this repository
        id: chores
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CHORES_DUMB_CLIENT_ID }}
          private-key: ${{ secrets.CHORES_DUMB_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the immutable annotated tag
        env:
          CUT: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ needs.identify.outputs.tag }}
          RELEASE_TOKEN: ${{ steps.chores.outputs.token }}
          RELEASE_APP: ${{ steps.chores.outputs.app-slug }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$RELEASE_TOKEN"; }; f'
        run: |
          test "$RELEASE_APP" = trueline-chores-dumb
          python3 scripts/version-cut.py tag "$CUT" "$TAG"
