name: Native macOS Machine removal
on:
  pull_request:
    paths:
      - 'cmd/managed-machine/**'
      - 'internal/cli/**'
      - 'internal/command/**'
      - 'internal/daemon/**'
      - 'internal/members/**'
      - 'internal/statedir/**'
      - 'internal/provider/brew/**'
      - 'keyd/**'
      - 'tests/fixtures/*homebrew-uninstall*.sh'
      - 'tests/fixtures/homebrew-launch-agents.py'
      - 'tests/fixtures/paired-darwin-hq-*'
      - 'tests/members-apply-macos.test.sh'
      - 'tests/fixtures/with-keyd-test-keychain.sh'
      - '.github/workflows/macos-uninstall.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-lifecycle:
    name: Homebrew source install, remove and reinstall on ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [macos-15, xcode-27]
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Qualify the checkout through a disposable local Homebrew tap
        run: |
          sw_vers
          uname -m
          bash tests/fixtures/source-homebrew-uninstall.sh
